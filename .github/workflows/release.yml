name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest # ponytail: macos-latest is arm64 (M-series)
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: tar czf otpdash-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/release otpdash
      - uses: softprops/action-gh-release@v2
        with:
          files: otpdash-*.tar.gz
